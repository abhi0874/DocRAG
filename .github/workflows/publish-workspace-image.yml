name: Publish approved DocRAG image
on:
  push:
    branches: [feat/production-rag]
    paths: [.github/workflows/publish-workspace-image.yml]

permissions: {}

jobs:
  publish:
    if: github.repository == 'abhi0874/DocRAG'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      packages: write
    env:
      SOURCE: c1a228d0c231652c567f48b1ac588422f542f7c0
      INDEX: sha256:f086d4b7cebb6780995d59a19c94167d2d85c3b43bbf5a0192d4dd29fc2a18e1
      RUNTIME: sha256:01994616d75f66806f7bdddfbe60d22a77ebf45149b01dd067c042cb36ce39ea
      IMAGE: ghcr.io/abhi0874/docrag
    steps:
      - name: Verify release window, tested commit and retained archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_URL: ${{ secrets.DOCRAG_OCI_TRANSFER_C1A228D }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -u -d '2026-11-25 08:00:00Z' +%s)"
          gh api repos/abhi0874/DocRAG/actions/runs/44343150740 |
            jq -e --arg source "$SOURCE" '.head_sha == $source and .event == "push" and .conclusion == "success" and .path == ".github/workflows/ci.yml"'
          [[ "$ARCHIVE_URL" == https://release-assets.githubusercontent.com/github-production-release-asset/* ]]
          curl --fail --silent --show-error --proto '=https' "$ARCHIVE_URL" --output release.oci.tar
          echo '29d0f6e75dc2e3165ef52ff9649280683cec94985327883db171fab4d47e3c98  release.oci.tar' | sha256sum --check
      - name: Install pinned OCI transfer client
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' https://github.com/oras-project/oras/releases/download/v1.4.0/oras_1.4.0_linux_amd64.tar.gz -o oras.tar.gz
          echo 'd8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1  oras.tar.gz' | sha256sum --check
          tar -xzf oras.tar.gz oras
      - name: Publish original OCI bytes and verify registry manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | ./oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ./oras cp --from-oci-layout "release.oci.tar@$INDEX" "$IMAGE:rc-c1a228d"
          test "$(./oras resolve "$IMAGE:rc-c1a228d")" = "$INDEX"
          for digest in "$INDEX" "$RUNTIME"; do
            ./oras manifest fetch "$IMAGE@$digest" --output fetched.json
            printf '%s  fetched.json\n' "${digest#sha256:}" | sha256sum --check
          done
