name: CI
on:
  pull_request:
  push:
    branches: [feat/production-rag, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: docrag_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d docrag_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_DATABASE_URL: postgresql://ci:ephemeral-ci-only@127.0.0.1:5432/docrag_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.25.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.6
      - run: make setup
      - name: Restore public deterministic mapping (no database or model cache)
        run: |
          mkdir -p .local
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          source = Path('eval/results/chunking/control-1000-200-mapping.json')
          with Path('.local/ollama-corpus-map.json').open('x') as output:
              json.dump({'chunks': json.loads(source.read_text())['chunks']}, output)
          PYTHON
      - run: make lint
      - run: make test
      - run: make cov
      - run: make build-fe
      - name: Migration repeatability and session preservation
        run: node --import tsx scripts/ci_migrations.ts
      - name: Real SQL retrieval without inference
        run: |
          .venv/bin/python -c "import os,psycopg; c=psycopg.connect(os.environ['CI_DATABASE_URL']); c.execute('CREATE EXTENSION IF NOT EXISTS vector'); c.commit(); c.close()"
          node --import tsx scripts/ci_retrieval.ts
      - name: Citation and quality gate negative controls
        run: .venv/bin/python -m pytest -q tests/test_observability_gate.py tests/test_security_gate.py tests/test_prompting_gate.py
