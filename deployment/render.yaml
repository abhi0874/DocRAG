# Review-only blueprint. Applying this file is a separate, unauthorized deployment action.
services:
  - type: web
    name: docrag-demo
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: DOCRAG_DEPLOYMENT
        value: recruiter-demo
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: RERANKER_ENABLED
        value: "false"
      - key: RESPONSE_CACHE_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_DATABASE_URL
        sync: false
      - key: DOCRAG_APP_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: DOCRAG_GEMINI_BILLING_CONFIRMED
        sync: false
